[project]
name = "alya-fiit-backend"
version = "1.0.0"
description = "Alya-FIIT e-shop backend (FastAPI, SQLAlchemy, SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "radon>=6.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "markdown>=3.6",
]
loadtest = [
    "locust>=2.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/infrastructure/seed/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90"]
ignore = ["B008"]  # FastAPI Depends(...) in defaults is idiomatic

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# Data generation is branchy by nature: one branch per data variation.
"app/infrastructure/seed/performance.py" = ["C901"]
"app/tests/**" = ["C901"]

[tool.bandit]
# Tests use `assert` by design.
exclude_dirs = ["app/tests"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = ["data"]

[[tool.mypy.overrides]]
module = "radon.*"
ignore_missing_imports = true
